status: published
source: https://docs.tinyfish.ai/mcp-integration
server:
  name: tinyfish
  transport: http
  url: https://agent.tinyfish.ai/mcp
  chatgpt_url: https://agent.tinyfish.ai/mcp/chatgpt
  auth: X-API-Key
install:
  claude_code: claude mcp add --transport http tinyfish https://agent.tinyfish.ai/mcp
  cursor_codex_windsurf: npx install-mcp@latest
notes: >-
  Official hosted/remote MCP server exposing the TinyFish Agent, Search, Fetch
  and Browser surfaces to AI assistants. A separate open-source local MCP server
  for AgentQL data extraction is published on npm as `agentql-mcp`.
