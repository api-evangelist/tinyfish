      security:
      - ApiKeyAuth: []
      parameters:
      - schema:
          type: string
          example: conn_123
        required: true
        name: connectionId
        in: path
      responses:
        '200':
          description: Vault disconnected successfully.
          content:
            application/json:
              schema:
                type: object
