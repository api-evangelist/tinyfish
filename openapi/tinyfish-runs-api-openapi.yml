    post:
      operationId: cancelRunById
      description: Cancel a run by ID. Only runs created via `/v1/automation/run-async` or `/v1/automation/run-sse` can be cancelled. Runs created via the synchronous `/v1/automation/run` endpoint cannot be cancelled.
      summary: Cancel run by ID
      tags:
      - Runs
      security:
      - ApiKeyAuth: []
      parameters:
      - schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Run ID
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        required: true
        description: Run ID
        name: id
        in: path
      responses:
        '200':
          description: Run cancelled successfully, or already in terminal state (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    description: The unique identifier of the run
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  status:
                    type: string
                    enum:
                    - CANCELLED
                    - COMPLETED
                    - FAILED
                    description: The current status of the run. Returns actual status for idempotent responses (e.g., COMPLETED if run already finished)
                    example: CANCELLED
                  cancelled_at:
                    type: string
                    nullable: true
                    description: ISO 8601 timestamp when the run was cancelled, or null if not cancelled
                    example: '2026-01-14T10:30:55Z'
                  message:
