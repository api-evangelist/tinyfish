  /v1/vault/items/sync:
    post:
      operationId: syncVaultItems
      summary: Sync vault items
      description: Sync items from connected providers and return merged item state plus sync counters.
      tags:
      - Vault
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Vault items synced successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId:
                          type: string
                          example: cred:conn-123:Personal:item-abc123
                        connectionId:
                          type: string
                          nullable: true
                          example: conn_123
                        label:
                          type: string
                          example: Amazon Login
                        vaultName:
                          type: string
                          example: Personal
                        domains:
                          type: array
                          items:
                            type: string
                          example:
                          - amazon.com
                        fieldMetadata:
                          type: array
                          items:
                            type: object
                            properties:
                              fieldId:
                                type: string
                                example: password
                              label:
                                type: string
                                example: Password
                              type:
                                type: string
                                enum:
                                - STRING
                                - CONCEALED
                                - OTP
                                example: CONCEALED
                            required:
                            - fieldId
                            - label
                            - type
                            description: Metadata for a single vault field.
                        hasTotp:
                          type: boolean
                          example: true
                      required:
                      - itemId
                      - connectionId
                      - label
                      - vaultName
                      - domains
                      - fieldMetadata
                      - hasTotp
                      description: Display-safe vault item metadata.
                  sync_summary:
                    type: object
                    properties:
                      added:
                        type: integer
                        minimum: 0
                        example: 3
                      updated:
                        type: integer
                        minimum: 0
                        example: 1
                      removed:
                        type: integer
                        minimum: 0
                        example: 0
                    required:
                    - added
                    - updated
                    - removed
                required:
                - items
                - sync_summary
        '401':
          description: Unauthorized - Invalid or missing API key, or vault connection expired and requires reconnection.
          content:
            application/json:
              schema:
                type: object
