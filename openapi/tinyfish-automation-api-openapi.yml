                description: Standard error response format
  /v1/automation/run-batch:
    post:
      operationId: runBatch
      summary: Start multiple automations asynchronously
      description: 'Creates and enqueues multiple automation runs in a single request, returning run_ids immediately without waiting for completion. Maximum 100 runs per request.


        **Atomic creation:** Run creation is all-or-nothing. Either all runs are created successfully, or none are (returns error).


        **Idempotency:** This endpoint does not currently support idempotency keys. Retrying a failed request may create duplicate runs.'
      tags:
      - Automation
      security:
      - ApiKeyAuth: []
      requestBody:
        description: Batch of automation task configurations
        content:
          application/json:
            schema:
              type: object
              properties:
                runs:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        description: Target website URL to automate
                        example: https://example.com
                      goal:
                        type: string
                        minLength: 1
                        description: Natural language description of what to accomplish on the website
                        example: Find the pricing page and extract all plan details
                      browser_profile:
                        type: string
                        enum:
                        - lite
                        - stealth
                        description: Browser profile for execution. LITE uses standard browser, STEALTH uses anti-detection browser.
                        example: lite
                      proxy_config:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            description: Enable proxy for this automation run
                            example: true
                          type:
                            type: string
                            enum:
                            - tetra
                            - custom
                            description: Proxy type. "tetra" uses the built-in Tetra proxy (default). "custom" routes through your own proxy server — requires url.
                            example: custom
                          country_code:
                            type: string
                            enum:
                            - US
                            - GB
                            - CA
                            - DE
                            - FR
                            - JP
                            - AU
                            description: Country code for Tetra proxy location. Only used when type is "tetra".
