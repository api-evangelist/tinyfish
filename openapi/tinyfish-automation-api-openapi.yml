                automationFailed:
                  summary: Automation execution failed
                  value:
                    run_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    status: FAILED
                    started_at: '2024-01-01T00:00:00Z'
                    finished_at: '2024-01-01T00:00:15Z'
                    num_of_steps: 3
                    result: null
                    error:
                      message: Browser crashed during execution
                infrastructureError:
                  summary: Infrastructure error (before run creation)
                  value:
                    run_id: null
                    status: FAILED
                    started_at: null
                    finished_at: null
                    num_of_steps: 0
                    result: null
                    error:
                      message: Internal server error
  /v1/automation/run-async:
    post:
      operationId: runAsync
      summary: Start automation asynchronously
      description: Creates and enqueues an automation run, returning the run_id immediately without waiting for completion. Use this for long-running automations where you want to poll for results separately.
      tags:
      - Automation
      security:
      - ApiKeyAuth: []
      requestBody:
        description: Automation task configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: Target website URL to automate
                  example: https://example.com
                goal:
                  type: string
                  minLength: 1
                  description: Natural language description of what to accomplish on the website
                  example: Find the pricing page and extract all plan details
                browser_profile:
                  type: string
                  enum:
                  - lite
                  - stealth
                  description: Browser profile for execution. LITE uses standard browser, STEALTH uses anti-detection browser.
                  example: lite
                proxy_config:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Enable proxy for this automation run
                      example: true
                    type:
                      type: string
                      enum:
                      - tetra
                      - custom
                      description: Proxy type. "tetra" uses the built-in Tetra proxy (default). "custom" routes through your own proxy server — requires url.
                      example: custom
                    country_code:
                      type: string
                      enum:
                      - US
                      - GB
                      - CA
                      - DE
                      - FR
                      - JP
                      - AU
                      description: Country code for Tetra proxy location. Only used when type is "tetra".
                      example: US
                    url:
                      type: string
                      format: uri
                      description: Your proxy server URL. Required when type is "custom".
                      example: http://proxy.example.com:8080
                    username:
                      type: string
                      description: Username for the custom proxy.
                    password:
                      type: string
                      description: Password for the custom proxy.
                  required:
                  - enabled
                  description: Proxy configuration
                api_integration:
                  type: string
                  description: Name of the integration making this API call (e.g., "dify", "zapier", "n8n"). Used for analytics.
                  example: dify
                agent_config:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - default
                      - strict
                      description: Agent behavior mode. "strict" enables fail-fast for test automation.
                      example: strict
                    max_steps:
                      type: integer
                      minimum: 1
                      maximum: 500
                      description: Maximum tool-call steps before the agent stops. Defaults to 150.
                      example: 50
                  description: Agent behavior configuration
                capture_config:
                  type: object
                  properties:
                    elements:
                      type: boolean
                    snapshots:
                      type: boolean
                    screenshots:
                      type: boolean
                    recording:
                      type: boolean
                  description: Configure which data to capture during the run.
                webhook_url:
                  type: string
                  format: uri
                  description: HTTPS URL to receive webhook notifications for run lifecycle events. Must use HTTPS.
                use_vault:
                  type: boolean
                  description: Opt-in to vault credentials for this run. When true, enabled vault items are included. Defaults to false.
                  example: true
                credential_item_ids:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                  description: 'Scope vault credentials to specific credential URIs. Requires use_vault to be true. If omitted with use_vault: true, all enabled items are used.'
                  example:
                  - cred:conn-abc:Work:item-123
                  - cred:conn-def:Personal:item-456
                output_schema:
                  anyOf:
                  - type: boolean
                  - type: object
                    properties: {}
                    additionalProperties:
                      nullable: true
                  description: Optional JSON Schema draft-07 contract for the run result.
                  example:
                    type: object
                    properties:
                      title:
                        type: string
                      price:
                        type: number
                    required:
                    - title
                    - price
              required:
              - url
              - goal
      responses:
        '200':
          description: Run created and enqueued successfully. Returns run_id immediately. The automation will execute asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    nullable: true
                    description: Unique identifier for the created automation run
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  error:
                    type: object
                    nullable: true
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                        example: INTERNAL_ERROR
                      message:
                        type: string
                        description: Error message if run creation failed
                        example: Internal server error
                    required:
                    - code
                    - message
                    description: Error details. Null if successful.
                required:
                - run_id
                - error
                description: Async automation run response. Returns run_id immediately without waiting for completion.
              example:
                run_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                error: null
        '400':
          description: Invalid request - missing required fields or invalid format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - MISSING_API_KEY
                        - INVALID_API_KEY
                        - INVALID_INPUT
                        - RATE_LIMIT_EXCEEDED
                        - INTERNAL_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - SERVICE_BUSY
                        - TIMEOUT
                        - INSUFFICIENT_CREDITS
                        - CONTENT_POLICY_VIOLATION
                        - MAX_STEPS_EXCEEDED
                        - SITE_BLOCKED
                        - TASK_FAILED
                        - CANCELLED
                        description: Machine-readable error code
                        example: INVALID_INPUT
                      message:
                        type: string
                        description: Human-readable error message
                        example: Field "url" is required and must be a string
                      details:
                        nullable: true
                        description: Additional error details (validation errors, etc.)
                    required:
                    - code
                    - message
                required:
                - error
                description: Standard error response format
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - MISSING_API_KEY
                        - INVALID_API_KEY
                        - INVALID_INPUT
                        - RATE_LIMIT_EXCEEDED
                        - INTERNAL_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - SERVICE_BUSY
                        - TIMEOUT
                        - INSUFFICIENT_CREDITS
                        - CONTENT_POLICY_VIOLATION
                        - MAX_STEPS_EXCEEDED
                        - SITE_BLOCKED
                        - TASK_FAILED
                        - CANCELLED
                        description: Machine-readable error code
                        example: INVALID_INPUT
                      message:
                        type: string
                        description: Human-readable error message
                        example: Field "url" is required and must be a string
                      details:
                        nullable: true
                        description: Additional error details (validation errors, etc.)
                    required:
                    - code
                    - message
                required:
                - error
                description: Standard error response format
        '403':
          description: Forbidden - Insufficient credits or no active subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - MISSING_API_KEY
                        - INVALID_API_KEY
                        - INVALID_INPUT
                        - RATE_LIMIT_EXCEEDED
                        - INTERNAL_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - SERVICE_BUSY
                        - TIMEOUT
                        - INSUFFICIENT_CREDITS
                        - CONTENT_POLICY_VIOLATION
                        - MAX_STEPS_EXCEEDED
                        - SITE_BLOCKED
                        - TASK_FAILED
                        - CANCELLED
                        description: Machine-readable error code
                        example: INVALID_INPUT
                      message:
                        type: string
                        description: Human-readable error message
                        example: Field "url" is required and must be a string
                      details:
                        nullable: true
                        description: Additional error details (validation errors, etc.)
                    required:
                    - code
                    - message
                required:
                - error
                description: Standard error response format
        '500':
          description: Internal server error - Failed to create or enqueue the automation run
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - MISSING_API_KEY
                        - INVALID_API_KEY
                        - INVALID_INPUT
                        - RATE_LIMIT_EXCEEDED
                        - INTERNAL_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - SERVICE_BUSY
                        - TIMEOUT
                        - INSUFFICIENT_CREDITS
                        - CONTENT_POLICY_VIOLATION
                        - MAX_STEPS_EXCEEDED
                        - SITE_BLOCKED
                        - TASK_FAILED
                        - CANCELLED
                        description: Machine-readable error code
                        example: INVALID_INPUT
                      message:
                        type: string
                        description: Human-readable error message
                        example: Field "url" is required and must be a string
                      details:
                        nullable: true
                        description: Additional error details (validation errors, etc.)
                    required:
