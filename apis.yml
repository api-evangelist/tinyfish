aid: tinyfish
name: TinyFish
description: >-
  TinyFish provides enterprise infrastructure for AI web agents — a unified platform that lets
  AI systems interact with the live web at scale. It ships four API surfaces: a Web Agent
  Automation API that turns natural-language goals into browser automations on real websites
  (sync, async, SSE-streaming, and batch), a Search API returning structured JSON from
  browser-rendered results, a Fetch API that converts rendered pages to clean markdown/JSON/HTML,
  and a Browser API for cloud CDP browser sessions with stealth/anti-bot capabilities. All APIs
  authenticate with an X-API-Key header, are documented at docs.tinyfish.ai with published OpenAPI
  specs and an llms.txt, and are exposed to assistants through an official hosted MCP server.
  TinyFish is the company behind the open-source AgentQL project and is backed by ICONIQ Capital.
